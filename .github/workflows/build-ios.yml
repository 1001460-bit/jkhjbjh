name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Pod install
        working-directory: app/ios
        run: pod install --repo-update

      - name: Fix bonsoir_darwin compilation (missing import Foundation)
        run: |
          # bonsoir_darwin has a known bug: some Swift files use JSONSerialization
          # without importing Foundation. Patch ALL .swift files in the package.
          BONJOUR_DIR="/Users/runner/.pub-cache/hosted/pub.dev/bonsoir_darwin-6.1.0"
          echo "Looking in: $BONJOUR_DIR"
          if [ ! -d "$BONJOUR_DIR" ]; then
            echo "Directory not found, searching..."
            BONJOUR_DIR=$(find /Users/runner/.pub-cache -type d -name "bonsoir_darwin-*" 2>/dev/null | head -1)
            echo "Found via search: $BONJOUR_DIR"
          fi
          if [ -n "$BONJOUR_DIR" ] && [ -d "$BONJOUR_DIR" ]; then
            echo "=== Patching all .swift files that use JSONSerialization ==="
            find "$BONJOUR_DIR" -name "*.swift" -type f | while read -r f; do
              if grep -q "JSONSerialization" "$f" && ! head -10 "$f" | grep -q "import Foundation"; then
                echo "Patching: $f"
                { echo "import Foundation"; cat "$f"; } > /tmp/bonjour_patched.swift
                mv /tmp/bonjour_patched.swift "$f"
                head -3 "$f"
              fi
            done
            echo "=== Patch complete ==="
            # Also list all files that contain JSONSerialization for debugging
            echo "=== Files containing JSONSerialization ==="
            grep -rl "JSONSerialization" "$BONJOUR_DIR" --include="*.swift" 2>/dev/null || echo "None found"
          else
            echo "ERROR: bonsoir_darwin directory not found"
            find /Users/runner/.pub-cache -type d -name "*bonsoir*" 2>/dev/null | head -10
          fi

      - name: Fix pdfrx null-safety compilation errors
        run: |
          # pdfrx has null-safety issues with newer Dart SDKs: PdfFileCache?
          # is accessed without null assertion. Patch in-place.
          PDFRX_FILE=$(find /Users/runner/.pub-cache -name "pdf_file_cache.dart" -path "*pdfrx*" 2>/dev/null | head -1)
          echo "Found pdfrx file: $PDFRX_FILE"
          if [ -n "$PDFRX_FILE" ] && [ -f "$PDFRX_FILE" ]; then
            echo "=== Before patch (lines 420-430) ==="
            sed -n '420,430p' "$PDFRX_FILE"
            # Add null assertion operator where cache is accessed
            sed -i '' 's/cache\.blockSize/cache!.blockSize/g' "$PDFRX_FILE"
            sed -i '' 's/cache\.read(/cache!.read(/g' "$PDFRX_FILE"
            echo "=== After patch (lines 420-430) ==="
            sed -n '420,430p' "$PDFRX_FILE"
          else
            echo "WARNING: pdf_file_cache.dart not found"
            find /Users/runner/.pub-cache -name "pdf_file_cache.dart" 2>/dev/null || true
          fi

      - name: Build Flutter iOS (release, no codesign)
        working-directory: app
        run: |
          flutter build ios --release --flavor intl --no-codesign

      - name: Archive (unsigned)
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme intl \
            -configuration Release-intl \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            || true

      - name: Package IPA (unsigned, for jailbroken devices)
        run: |
          ARCHIVE="$RUNNER_TEMP/Runner.xcarchive"
          PAYLOAD="$RUNNER_TEMP/Payload"
          IPA_DIR="$GITHUB_WORKSPACE/build_output"
          IPA_NAME="ShrimpSend-unsigned.ipa"

          mkdir -p "$PAYLOAD" "$IPA_DIR"

          # If xcodebuild archive succeeded, use the .app from archive;
          # otherwise fall back to flutter build output.
          if [ -d "$ARCHIVE/Products/Applications/Runner.app" ]; then
            cp -R "$ARCHIVE/Products/Applications/Runner.app" "$PAYLOAD/"
          elif [ -d "$GITHUB_WORKSPACE/app/build/ios/iphoneos/Runner.app" ]; then
            cp -R "$GITHUB_WORKSPACE/app/build/ios/iphoneos/Runner.app" "$PAYLOAD/"
          else
            echo "ERROR: Could not find Runner.app"
            find "$GITHUB_WORKSPACE/app/build" -name "*.app" 2>/dev/null || true
            exit 1
          fi

          # Remove code signature (jailbroken devices don't need it)
          rm -rf "$PAYLOAD/Runner.app/_CodeSignature" 2>/dev/null || true
          rm -f "$PAYLOAD/Runner.app/embedded.mobileprovision" 2>/dev/null || true

          cd "$RUNNER_TEMP"
          zip -qr "$IPA_DIR/$IPA_NAME" Payload
          cd "$GITHUB_WORKSPACE"

          echo "IPA built: $IPA_DIR/$IPA_NAME"
          ls -lh "$IPA_DIR/$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShrimpSend-unsigned-ipa
          path: build_output/ShrimpSend-unsigned.ipa
          retention-days: 30
